security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout
                enable_csrf: true
                # where to redirect after logout
                # target: app_any_route

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # ROLE_ADMIN garde tous les droits (rétrocompatibilité) : il hérite de chaque permission
    # spécialisée. ROLE_SUPER_ADMIN hérite de ROLE_ADMIN et n'ajoute rien ici : son pouvoir
    # supplémentaire (gérer les permissions des autres administrateurs, modérer un compte
    # administrateur, consulter l'historique complet) est vérifié explicitement dans le code,
    # jamais via la hiérarchie, pour ne jamais être hérité par un simple ROLE_ADMIN.
    role_hierarchy:
        ROLE_ADMIN:
            - ROLE_ADMIN_EVENTS
            - ROLE_ADMIN_SHOP
            - ROLE_ADMIN_ORDERS
            - ROLE_ADMIN_SERVERS
            - ROLE_ADMIN_RULES
            - ROLE_ADMIN_MEMBERS
        ROLE_SUPER_ADMIN: ROLE_ADMIN

    # Note: Only the *first* matching rule is applied
    access_control:
        # Accès au panneau admin dès qu'on détient au moins une permission administrative
        # (ROLE_ADMIN/ROLE_SUPER_ADMIN sont inclus via la hiérarchie ci-dessus). Chaque
        # contrôleur applique ensuite sa propre permission spécifique.
        - { path: ^/admin, roles: [ROLE_ADMIN_EVENTS, ROLE_ADMIN_SHOP, ROLE_ADMIN_ORDERS, ROLE_ADMIN_SERVERS, ROLE_ADMIN_RULES, ROLE_ADMIN_MEMBERS] }
        - { path: ^/account, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
